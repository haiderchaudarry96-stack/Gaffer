<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
<title id="t">Gaffer use cases</title><desc id="d">UML-style use case diagram. Inside the Gaffer boundary: upload own drone video, confirm the pitch corners, try a sample clip, watch the recorded match (Live analysis), review an alert with its evidence, approve or reject an alert, ask the analyst (chat), read the report. Actors: Coach, linked to all eight use cases, and Judge / visitor, who can do everything a coach does (UML generalisation), including uploading their own video and confirming its pitch corners. Supporting systems outside the boundary: the OpenCV 5 pipeline on Amazon EC2 and Amazon Bedrock (Nova 2 Lite).</desc>
<rect id="background" width="1920" height="1080" fill="#F3F5EF"/>
<g id="header"><g id="logo" transform="translate(56 28) scale(0.875)"><rect width="64" height="64" rx="14" fill="#070D0A"/><rect x="9" y="12" width="46" height="40" rx="4" fill="#16231C" stroke="#8FA398" stroke-width="3"/><line x1="32" y1="12" x2="32" y2="52" stroke="#8FA398" stroke-width="2.2"/><circle cx="19" cy="23" r="4.2" fill="#FF5B4F"/><circle cx="19" cy="41" r="4.2" fill="#FF5B4F"/><circle cx="45" cy="23" r="4.2" fill="#44C8FF"/><path d="M30 41 L38 49 L56 30" fill="none" stroke="#070D0A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 41 L38 49 L56 30" fill="none" stroke="#C8F542" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="128" y="68" font-family="Space Grotesk, Inter, sans-serif" font-size="40" font-weight="700" fill="#0B1510" letter-spacing="-0.5">Gaffer<tspan fill="#4A5C52" font-weight="500" dx="14">Use cases</tspan></text><text x="128" y="102" font-family="Inter, sans-serif" font-size="21" font-weight="400" fill="#4A5C52" data-maxw="1320">Who uses Gaffer and for what. The two systems on the right do the work behind the use cases.</text><text x="1864" y="68" font-family="JetBrains Mono, monospace" font-size="18" font-weight="400" fill="#4A5C52" text-anchor="end">gaffer-tactics.duckdns.org</text></g>
<g id="system-boundary"><rect x="540" y="138" width="840" height="912" rx="24" fill="#E9EEE5" stroke="#4A6B00" stroke-width="2.5"/><text x="570" y="184" font-family="Space Grotesk, Inter, sans-serif" font-size="30" font-weight="700" fill="#0B1510" data-maxw="200">Gaffer</text><text x="1350" y="182" font-family="JetBrains Mono, monospace" font-size="18" font-weight="400" fill="#4A5C52" text-anchor="end">web app</text></g>
