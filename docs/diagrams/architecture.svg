<g id="legend"><g id="legend-1"><circle cx="70" cy="1022" r="14" fill="#C8F542" stroke="#C8F542" stroke-width="1.5"/><text x="70" y="1028" font-family="Space Grotesk, Inter, sans-serif" font-size="17" font-weight="700" fill="#070D0A" text-anchor="middle">1</text></g><text x="94" y="1029" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#EEF4F0" data-maxw="258">Coach uploads a clip</text><g id="legend-2"><circle cx="374" cy="1022" r="14" fill="#C8F542" stroke="#C8F542" stroke-width="1.5"/><text x="374" y="1028" font-family="Space Grotesk, Inter, sans-serif" font-size="17" font-weight="700" fill="#070D0A" text-anchor="middle">2</text></g><text x="398" y="1029" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#EEF4F0" data-maxw="258">OpenCV reads the video</text><g id="legend-3"><circle cx="678" cy="1022" r="14" fill="#C8F542" stroke="#C8F542" stroke-width="1.5"/><text x="678" y="1028" font-family="Space Grotesk, Inter, sans-serif" font-size="17" font-weight="700" fill="#070D0A" text-anchor="middle">3</text></g><text x="702" y="1029" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#EEF4F0" data-maxw="258">Positions per frame</text><g id="legend-4"><circle cx="982" cy="1022" r="14" fill="#C8F542" stroke="#C8F542" stroke-width="1.5"/><text x="982" y="1028" font-family="Space Grotesk, Inter, sans-serif" font-size="17" font-weight="700" fill="#070D0A" text-anchor="middle">4</text></g><text x="1006" y="1029" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#EEF4F0" data-maxw="258">Candidate shape change</text><g id="legend-5"><circle cx="1286" cy="1022" r="14" fill="#C8F542" stroke="#C8F542" stroke-width="1.5"/><text x="1286" y="1028" font-family="Space Grotesk, Inter, sans-serif" font-size="17" font-weight="700" fill="#070D0A" text-anchor="middle">5</text></g><text x="1310" y="1029" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#EEF4F0" data-maxw="258">Nova + rules verify</text><g id="legend-6"><circle cx="1590" cy="1022" r="14" fill="#C8F542" stroke="#C8F542" stroke-width="1.5"/><text x="1590" y="1028" font-family="Space Grotesk, Inter, sans-serif" font-size="17" font-weight="700" fill="#070D0A" text-anchor="middle">6</text></g><text x="1614" y="1029" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#EEF4F0" data-maxw="258">Coach approves the alert</text></g>
</svg>
