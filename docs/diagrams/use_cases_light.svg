<g id="uc-6"><ellipse cx="960" cy="762" rx="290" ry="43" fill="#FFFFFF" stroke="#AFBDB1" stroke-width="2"/><text x="960" y="771" font-family="Inter, sans-serif" font-size="26" font-weight="600" fill="#0B1510" text-anchor="middle" data-maxw="520">Approve or reject an alert</text></g>
