<g id="uc-2"><ellipse cx="960" cy="354" rx="290" ry="43" fill="#FFFFFF" stroke="#AFBDB1" stroke-width="2"/><text x="960" y="363" font-family="Inter, sans-serif" font-size="26" font-weight="600" fill="#0B1510" text-anchor="middle" data-maxw="520">Confirm the pitch corners</text></g>
<g id="uc-3"><ellipse cx="960" cy="456" rx="290" ry="43" fill="#FFFFFF" stroke="#AFBDB1" stroke-width="2"/><text x="960" y="465" font-family="Inter, sans-serif" font-size="26" font-weight="600" fill="#0B1510" text-anchor="middle" data-maxw="520">Try a sample clip</text></g>
<g id="uc-4"><ellipse cx="960" cy="558" rx="290" ry="43" fill="#FFFFFF" stroke="#AFBDB1" stroke-width="2"/><text x="960" y="554" font-family="Inter, sans-serif" font-size="26" font-weight="600" fill="#0B1510" text-anchor="middle" data-maxw="520">Watch the recorded match</text><text x="960" y="584" font-family="Inter, sans-serif" font-size="21" font-weight="400" fill="#4A5C52" text-anchor="middle" data-maxw="520">(Live analysis)</text></g>
