# Gaffer configuration. Every threshold, model id, path and region lives here.
seed: 42

paths:
  outputs: outputs
  models: models
  teamtrack: data/teamtrack
  llm_log: outputs/llm_calls.jsonl

aws:
  region: ap-southeast-2          # Free-plan account is locked to Sydney
  profile: default                # overridden by AWS_PROFILE in .env

bedrock:
  # Nova 2 Lite runs in Sydney only via the global cross-region inference profile
  # (confirmed with `aws bedrock list-inference-profiles`, 2026-10-09).
  model_id: global.amazon.nova-2-lite-v1:0
  fallback_model_id: apac.amazon.nova-micro-v1:0
  max_tokens: 512
  temperature: 0.2
  retry:
    max_attempts: 4               # total attempts, including the first
    base_delay_s: 1.0             # exponential backoff: base * 2^n + jitter
    max_delay_s: 20.0
  timeout_s: 60

detector:
  name: yolox_s
  # OpenCV Model Zoo, Apache 2.0
  url: https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/object_detection_yolox/object_detection_yolox_2022nov.onnx
  file: models/object_detection_yolox_2022nov.onnx
  input_size: 640
  strides: [8, 16, 32]
  conf_threshold: 0.30
  nms_threshold: 0.45
  classes_of_interest:            # COCO ids
    person: 0
    sports_ball: 32
  views:                          # method per view, chosen by scripts/compare_detectors.py
    top:
      method: classical
      roi_margin_goal_m: 1.0      # keepers stand on the line; goals sit behind it
      roi_margin_touch_m: 1.0     # throw-ins; painted text starts ~2.5 m outside (dev clip)
      corner_exclusion_m: 1.5     # corner flags
      goal_exclusion_m: 0.3       # goal frames (posts on the line, nets behind)
    side:
      method: tiled_yolox
      roi_margin_goal_m: 1.0
      roi_margin_touch_m: 1.0
      corner_exclusion_m: 1.5
      goal_exclusion_m: 0.3
  tiled_yolox:
    tile_px: 640                  # network input; native tile = tile_px / upscale
    overlap_px: 96                # > the largest player box, so nobody is cut at every tile
    upscale: 1.0
    conf_threshold: 0.30
    nms_threshold: 0.45
  classical:                      # top view; tuned on the dev clip only (compare_detectors.py)
    scale: 0.5                    # work on a half-resolution frame (players ~15 px)
    bg_downscale: 8               # spatial grass background: downscale 8x ...
    bg_median_k: 5                # ... and median 5x5 (~40 m^2 neighbourhood >> one player)
    lab_weights: [0.5, 1.0, 1.0]  # lightness counts half: grass stripes differ mostly in L
    diff_threshold: 20.0          # weighted Lab distance to the background
    line_width_m: 0.35            # band around the projected lines (0.12 m paint + homography error)
    line_open_m: 0.4              # inside the band keep only blobs wider than this (paint ~0.12 m;
                                  # 0.55 m also erased players on lines: dev recall 0.989 -> 0.960)
    max_inside_lines: 0.97        # drop blobs lying >= 97 % inside the band (line-crossing remnants;
                                  # 0.9 also dropped real players: dev recall 0.989 -> 0.977)
                                  # a player on a line always sticks out of a 0.35 m band
    open_px: 3
    close_px: 5
    min_area_m2: 0.12             # blob area limits (pitch metres, scale-independent)
    max_area_m2: 6.0
    single_area_m2: 0.55          # typical one-player blob; blobs >= split_factor x this are split
    split_factor: 1.7
    box_size_m: 1.2               # output box side (GT top-view boxes: median ~34 px = 1.2 m)
  background:                     # side-view classical baseline (static camera, MOG2)
    history_s: 60.0               # MOG2 history (s); 15 s absorbed standing players
                                  # (dev F1@1m 0.42 -> 0.48)
    var_threshold: 16.0
    detect_shadows: true          # shadow pixels (MOG2 value 127) count as background
    open_px: 3
    close_px: [3, 9]              # w, h: rejoin torso and legs split by grass-coloured shorts
    player_height_m: 1.75         # expected box height = this x local ground scale (px per m)
    player_width_m: 0.6
    min_height_frac: 0.55         # blob height relative to the expected height (0.35-0.55: same F1)
    max_height_frac: 2.2
    min_fill: 0.15                # blob area relative to expected height x width
    split_factor: 1.7             # blobs this many expected widths wide are split
    pad_top_m: 2.5                # band above the far touchline (players stand up into it)
  eval:
    iou_threshold: 0.5
    distance_threshold_m: 1.0     # centre-distance match on the pitch (drone boxes are tiny)
    distance_loose_m: 2.0         # side view: far-half positions are only good to ~1-2 m
    dev_clips: [D_20220220_1_1530_1560, F_20220220_1_1680_1710]   # tuning only; never reported
    warmup_s: 5.0                 # side compare: frames the background model learns before scoring

eda:
  sample_frames_per_view: 3
  heatmap_bins: [96, 54]
  max_image_width: 1920           # EDA images are downscaled to keep the repo small
  team_colours_bgr:               # drawing colours by TeamID (not the real shirt colours)
    "0": [255, 140, 30]
    "1": [40, 40, 230]
    BALL: [0, 230, 255]
    other: [200, 200, 200]

pitch:
  # TeamTrack pitch: fitted 105.9 x 68.2 m from 31 drone landmarks (IFAB markings as scale,
  # scripts/calibrate.py, 10 Oct) -> within 2 % of 105 x 68, so the standard size is kept.
  length_m: 105.0
  width_m: 68.0
  markings:                       # IFAB fixed sizes: they anchor the metric scale when fitting
    penalty_area_depth_m: 16.5
    penalty_area_width_m: 40.32
    goal_area_depth_m: 5.5
    goal_area_width_m: 18.32
    penalty_spot_m: 11.0
    centre_circle_radius_m: 9.15

# --------------------------------------------------------------------------- Phase 2: perception
perception:
  sample_fps: 2.0                 # same rate as the synthetic data
  possession_radius_m: 2.0        # nearest player within this of the ball has it (shared rule)
  track_fps: {top: 4.0, side: 2.0}  # detection + tracking rate per view, an integer multiple of
                                  # sample_fps. Top 4 fps (user decision 14 Oct: ID switches
                                  # 3.4 -> 1.6 /player-min, team acc 95.9 -> 98.5 %, 1.4x cost);
                                  # side stays 2 fps (tiled YOLOX is 2.7 s per frame)
  foot_point: {top: centre, side: bottom}   # ground contact of a box (drone: blob centre)
  min_players_per_frame: 6        # median detections per frame below this -> TooFewPlayersError
  official: {outside_m: 0.0, min_share: 0.75}  # a track beyond a touchline (by > outside_m) for
                                  # >= 75 % of its life is an official/staff member, not a player
                                  # (user decision 14 Oct; dev clips only, tune_officials.py:
                                  # middle of the 0.5-0.9 plateau, no GT player flagged)
  static_object: {min_s: 20.0, max_spread_m: 0.3}   # a track that stays within 0.3 m (p95) for
                                  # 20 s+ is an object (spare balls behind a goal), not a person
  self_calibration:               # per-video self-calibration (perception/selfcal.py, 23 Oct):
                                  # learnt from each video, OpenCV only; each part is a switch
                                  # measured on and off (FAILURE_LOG 2026-10-23, unseen ground)
    views: [top]                  # cameras it applies to (the side view is unchanged)
    pitch_mask: true              # drop detections outside the confirmed pitch + margin
    pitch_mask_margin_m: 1.5      # throw-ins and keepers on the line stay
    grass_model: true             # this video's grass colour (HSV, inside the pitch, first frame)
    grass: {analysis_width_px: 960, inset_m: 1.0, line_band_m: 1.0, min_saturation: 20,
            min_value: 20, min_pixels: 5000, hue_window: 20, hue_percentiles: [1, 99],
            hue_margin: [3, 8], saturation_factor: 0.7, value_frac: 0.7}
    shadows: true                 # darker grass (shadows) = background; thin long blobs rejected
    shadow: {value_frac: 0.10, hue_extra: 35, saturation_frac: 1.0, thin_width_m: 0.5,
             max_elongation: 4.0}
    local_scale: true             # player size from the homography at each blob; working scale
    working_px_per_m: 14.7        # = TeamTrack 29.4 px/m x 0.5 (detector.classical.scale)
    static_objects: true          # detections recurring at the same pitch point over the run
    static: {radius_m: 0.5, min_share: 0.6, min_frames: 30, min_span_s: 20.0}
    crop_exclude_lines: false     # painted lines left out of the team-colour crops. OFF: on the
                                  # Zenodo tuning third it lowered team accuracy 0.96 -> 0.85,
                                  # TeamTrack dev neutral (95.5 vs 95.2 % right team), 23 Oct
    crop_line_band_m: 0.3
    crop_foreground: true         # team colour from the player's own foreground pixels only
    adaptive_gate: true           # team-colour gate from this video's colour distribution:
    gate: {percentile: 90, scale: 1.5, min_sep_frac: 0.15, max_sep_frac: 0.7}  # scale x the
                                  # team's percentile distance, within these fractions of the
                                  # distance between the two team colours (replaces gate/min_gate)
    calibration_tiers:           # default-off measured rules first, then numeric-only Nova
      tier1:
        enabled: false            # existing Prompt 1 settings remain the baseline
        local_scale_min_px_per_m: 14.7  # below this scale, local blob-size scaling is disabled
      healthy_ranges:              # Nova is skipped when all three checks are healthy
        min_outfield_points_per_team: 7
        max_outfield_points_per_team: 12
        max_duplicate_share: 0.15
        duplicate_radius_m: 1.5
        min_team_labelled_share: 0.8
      tier2:
        enabled: false            # no real Bedrock call until explicitly enabled
        window_start_s: 1.0       # auto-detect reference frame; coach confirms this pitch
        window_s: 60.0            # short OpenCV proposal trial, before any full-video rerun
        max_retries: 2
        max_calls_per_analysis: 2 # includes client retries; also bounded by the API daily cap
        max_cost_usd_per_analysis: 0.005
        max_input_tokens: 2000
        max_tokens: 180
        min_reason_chars: 20
        max_reason_chars: 240
        min_health_improvement: 0.000001
        temperature: 0.0
        step_tolerance: 0.000001
        no_change_tolerance: 0.000000001
        allowed_settings:           # only these paths and values can be proposed
          perception.self_calibration.local_scale: {values: [false, true]}
          perception.self_calibration.gate.scale: {min: 1.0, max: 1.8, step: 0.1}
          perception.self_calibration.gate.percentile: {min: 75, max: 95, step: 5}
          perception.self_calibration.pitch_mask_margin_m: {min: 0.5, max: 2.0, step: 0.25}
          perception.self_calibration.static.min_share: {min: 0.5, max: 0.8, step: 0.05}
  teams:                          # per footage: names, display colours, shirt-colour hints
    home: {name: White, colour: "#f0f0f0", shirt_hint: "#f0f0f0"}   # TeamTrack TeamID 0
    away: {name: Blue, colour: "#1f3a8a", shirt_hint: "#2848a0"}    # TeamTrack TeamID 1
  debug_video:
    width_px: 1920
    minimap_px_per_m: 4.0
    side_rows: [380, 1000]        # side panorama rows shown (the pitch band)
    minimap_rotate_180: [top]     # drone image is rotated 180 deg vs the pitch frame
    colours_bgr: {home: [240, 240, 240], away: [160, 60, 20], referee: [0, 220, 255],
                  unknown: [150, 150, 150]}

teams:                            # team classifier (perception/team_classifier.py)
  torso:                          # crop of each box: x0, x1, y0, y1 as fractions
    top: [0.0, 1.0, 0.0, 1.0]     # drone: the whole ~1.2 m box (shoulders around the head)
    side: [0.2, 0.8, 0.12, 0.5]   # side: upper-middle band (shirt), not legs or background
  grass_hue: [30, 75]             # OpenCV hue band of grass (top view grass H 43-55, side 13-60)
  grass_min_saturation: 40
  min_pixels: 6                   # fewer non-grass pixels -> no vote this frame
  l_weight: 0.75                  # weight of lightness L* vs a*, b*; re-chosen on the dev clips
                                  # only (15 Oct, scripts/tune_teams.py, 3-class crop accuracy);
                                  # was 0.5, chosen with eval data on 14 Oct
  gate: 2.0                       # outlier gate = gate x median distance to the team centre (was
                                  # 2.5); >= 3.5 puts most officials/staff crops into a team
  min_gate: 5.0                   # (CIELAB units)
  refit_rounds: 4
  other_clusters: 3               # referee/officials + two keepers: their own k-means clusters
  min_fit_samples: 40
  max_fit_samples: 4000
  vote_window: 10                 # per-track majority over the last 10 votes ...
  min_votes: 3                    # ... once it has 3 votes ("unknown" before) ...
  min_share: 0.6                  # ... and the majority holds 60 %
  keeper_zone: {depth_m: 30.0, half_width_m: 22.0}   # 'other' track whose median is here =
  # keeper. Re-checked on dev clips only (15 Oct): the home keeper's median is 24.5 m (top dev)
  # and 24.2 m (side dev) from their goal line, so 30 m (a 5 m margin) stays. History: 20 -> 30 m
  # on 14 Oct after an eval run (away keeper at 20.6 m), disclosed in FAILURE_LOG.

tracking:                         # supervision ByteTrack (perception/tracker.py)
  match_scale_hz: 12.0            # matching boxes enlarged 1 + 12 / fps x around their centre:
  min_match_scale: 2.0            # 7x at 2 fps, 4x at 4, 3x at 6 (dev-clip sweeps of both views,
                                  # 14 Oct; the side view prefers smaller boxes at 6 fps)
  unit_scores: true               # classical blob "scores" are areas, not confidences: ByteTrack
                                  # multiplies IoU by score (dev ID switches 61 -> 41 at 7x)
  activation_threshold: 0.25
  matching_threshold: 0.8         # max (1 - IoU x score) for a match
  lost_s: 3.0                     # keep a lost track this long before dropping it
  min_consecutive_frames: 1
  eval:
    match_m: {top: 1.0, side: 2.0}   # GT <-> track distance for ID switches / team accuracy

teamtrack:
  # Clip sets by match time [start_s, end_s). Scripts use dev + eval unless asked (--set eval2).
  # eval2 = the "second eval set" (downloaded by hand by the user, 15 Oct): never used for
  # tuning, but NOT independent of eval (same match, same cameras, neighbouring minutes).
  # train = Kaggle soccer_top/train, 0-1260 s of the same match (downloaded by hand by the user,
  # 16 Oct): used for the oracle search for sustained changes (Phase 3 Task E), never for tuning.
  clip_sets:
    top: {dev: [1530, 1560], eval: [1560, 1800], eval2: [1260, 1530],   # eval2 = Kaggle val
          train: [0, 1260]}                                              # train = Kaggle train
    side: {dev: [1680, 1710], eval: [1710, 1800], eval2: [1800, 1980]}  # eval2 = Kaggle test
  default_sets: [dev, eval]
  views:
    top: {folder: soccer_top, foot_point: centre, calibration: top}   # drone: blob centre
    side: {folder: soccer_side, foot_point: bottom, calibration: side,  # feet = box bottom
           gt_foot_inset_px: 2.5}  # GT boxes end 2-3 px below the feet (median 2 far, 3 mid;
                                   # temporal-median foreground, 566 isolated boxes, 14 Oct)
  teams:                          # TeamID -> contract side (shirt colours from DATA_NOTES)
    "0": {side: home, name: White, colour: "#f0f0f0"}
    "1": {side: away, name: Blue, colour: "#1f3a8a"}
  clip_lists: data/clips          # <match_id>.clips.json written by the oracle / pipeline

zenodo:                           # unseen drone footage (scripts/eval_zenodo.py, 23 Oct): Synowiec,
  # Nowak, Kamola, "Soccer pitch top-view ...", Zenodo 10.5281/zenodo.14867795, CC BY 4.0
  video: data/zenodo/top-view-preview.mp4          # 3840x2160, 30 fps, 900 frames (30 s)
  annotations: data/zenodo/annotations/top-view-1.csv   # from annotations-top-view.zip
  # annotation frame_id = video frame + 1900, measured by matching detections to annotations
  # (recall at 0.7 m peaks at 1900 over 27 frames; 1-frame steps around it drop 2-4 points).
  # Annotations exist for video frames 0-800 only (26.7 s); the y axis runs from the image top.
  frame_offset: 1900
  tune_s: [0.0, 10.0]             # first third: the only Zenodo frames settings may be chosen on
  test_s: [10.0, 26.7]            # unseen test (the annotated rest; 26.7-30 s has no annotations)
  calibration_dir: outputs/zenodo/calibration      # auto-detected 4 corners (as in the upload path)

drift:                            # per-frame re-anchoring of the top view (perception/drift.py)
  scale: 0.25                     # alignment on a quarter-resolution line image
  blur_sigma_px: 2.0
  motion: affine
  iterations: 100
  eps: 1.0e-5
  min_correlation: 0.6            # ECC correlation below this -> ORB fallback
  views: [top]                   # cameras that drift (side: 0.3 px per clip, static)
  coarse_to_fine:                # A4 (24 Oct): ECC first on a copy at `factor` x scale, its warp
    enabled: true                # starts the normal ECC. ON: Zenodo test 4.39 -> 1.29 s per video s
    factor: 0.5                  # (ORB fallbacks 21 of 24 -> 0), F1 0.8553 -> 0.8533; TeamTrack eval
                                 # identical (outputs/a4_summary.txt, RECORD 24 Oct)
  homography_ok_max_error_m: 0.5  # per-frame line error above this -> quality.homography_ok false
  # Re-anchored on EVERY sampled frame: eval_drift.py showed per-clip anchors leave 0.105 m median
  # (max 0.36 m: the drone wobbles within a clip) vs 0.036 m per frame, for ~125 ms per frame.

calibration:
  dir: data/calibration           # <view>_points.json (picked landmarks) -> <view>.json (fit)
  overlay_dir: outputs/calibration
  fit_pitch_size: true            # fit L x W from the fixed-size markings ...
  keep_default_size_within: 0.02  # ... but keep pitch.length_m/width_m if the fit agrees within 2 %
  line_error:
    sample_step_m: 0.5
    max_search_m: 2.0             # no painted line within this -> "not found", not an error
  views:
    top:
      line_mask: {kernel_px: 25, threshold: 30, max_saturation: 90, min_component_px: 150}
      snap: {radius_px: 60, band_px: 12, inlier_px: 3.0, min_pixels: 25, spot_radius_px: 14,
             max_move_px: 25}
    side:
      line_mask: {kernel_px: 15, threshold: 18, max_saturation: 110, min_component_px: 40,
                  close_px: 3}
      snap: {radius_px: 45, band_px: 8, inlier_px: 2.0, min_pixels: 12, spot_radius_px: 8,
             max_move_px: 6}  # far lines meet at grazing angles: snaps only polish picks
      overlay_rows: [420, 960]    # rows of the panorama saved in overlay images (the pitch band)
      birdseye_px_per_m: 10
      models:                     # candidates compared by held-out landmark error (undistort.py)
        candidates: [homography, sectioned_2, sectioned_4, fisheye, cylindrical]
        sections:                 # interior image-column boundaries per sectioned variant
          sectioned_2: [3540]     # at the halfway line
          sectioned_4: [2600, 3540, 4400]
        section_margin_px: 150    # landmarks this close to a boundary are used by both sections
        init:                     # starting point for the parametric models (from DATA_NOTES rows)
          camera_m: [52.5, -15.0, 3.6]   # camera centre (pitch metres; z up)
          horizon_v_px: 400
          cylinder_f_px: 2070     # ~6500 px over ~180 degrees
          cylinder_cu_px: 3540    # halfway line column
          fisheye_f_px: 2000
          fisheye_max_rms_px: 50  # cv2.fisheye.calibrate results worse than this are refitted
  # ---- Phase 4: uploads that are not TeamTrack clips (perception/pitch.py, api/calib.py).
  # New sub-blocks only; nothing above changes. Accuracy on real footage: measured with
  # `py scripts\eval_autodetect.py` (laptop, TeamTrack clips). Thresholds were set on generated
  # frames; on 17 Oct the first real run (0 / 180 correct: turf edge taken for a goal line) led
  # to the candidate-edge choice, inward_frac 0.20 and max_markings_not_found (FAILURE_LOG
  # 2026-10-17): designed on the same TeamTrack clips it is measured on, so not held out.
  four_corner:                    # the coach's (or confirmed auto-detected) 4 pitch corners
    max_outside_frac: 0.25        # a point may lie this far outside the frame (share of its size)
    min_area_frac: 0.05           # the quad must cover >= 5 % of the frame
    min_opposite_edge_ratio: 0.6  # shorter / longer of each pair of opposite edges; below this
                                  # the camera is too tilted for a top-down analysis -> refused
    long_side: auto               # auto: the longer pair of image edges is the pitch length
  auto_detect:
    analysis_width_px: 960        # detection runs on a frame downscaled to this width
    frame_t_s: 1.0                # frame used (seconds into the video; 0 if shorter)
    grass_min_value: 30           # grass = teams.grass_hue band, S >= teams.grass_min_saturation
                                  # (the team classifier's grass test), and V >= this
    close_px: 15                  # closing fills players and painted lines inside the pitch
    open_px: 5                    # opening removes grass specks outside it
    approx_eps: [0.005, 0.08]     # cv2.approxPolyDP epsilon range (share of the hull perimeter)
    line_mask: {kernel_px: 9, threshold: 25, max_saturation: 90, min_component_px: 30}
    snap:                         # move each edge to the painted boundary line where visible
      inward_frac: 0.20           # search up to 20 % of the quad's depth inwards (run-off grass;
                                  # was 12 %: missed goal lines behind wide run-off, 17 Oct)
      outward_frac: 0.02          # and 2 % outwards
      samples: 80                 # points sampled along an edge (its middle 80 %)
      band_px: 3                  # cv2.fitLine on line pixels within this of the best line
      min_support: 0.35           # share of an edge's samples on a painted line to be a candidate
      max_candidates: 3           # painted-line candidates kept per edge (+ the grass edge); the
                                  # combination whose markings line up best wins (17 Oct: the
                                  # outermost line was often the turf edge, not the goal line)
      candidate_sep_frac: 0.02    # candidates closer than this share of the depth are one line
      max_shift_frac: 0.25        # a corner may move at most this share of the quad's size
    confidence:                   # each part 0..1; confidence = geometric mean of the parts
      min_area_frac: 0.15         # quad area / frame area: 0 at this ...
      good_area_frac: 0.40        # ... 1 at this
      aspect_tolerance: 0.35      # |log(quad aspect / (length / width))| at which the part is 0
      good_line_support: 0.6      # mean edge support on painted lines that counts as 1
      max_line_error_m: 1.5       # projected markings vs painted lines (median): 0 at this
      max_markings_not_found: 0.20  # share of marking samples with no painted line within 2 m:
                                  # 0 at this (a wrong outline leaves whole lines unmatched)
      max_line_density: 0.08      # line-mask pixels inside the quad above this = clutter, not
                                  # painted lines (markings part 0; a real pitch is ~1-3 %)
      corner_margin_px: 4         # a corner this close to the frame border = pitch cut off
      accept: 0.65                # >= this (and no hard failure) -> ask the coach to confirm

# --------------------------------------------------------------------------- Phase 1: tactics
formations:
  # Outfield players per team (goalkeeper excluded). Futsal would be 4.
  outfield_players: 10
  # Templates are generated from the name: lines evenly spaced over `depth_m` (back line to
  # front line), players in a line evenly spread over `line_width_m[count]`.
  templates: ["4-4-2", "4-3-3", "4-2-3-1", "3-5-2", "3-4-3", "5-3-2"]
  depth_m: 30.0
  line_width_m: {1: 0.0, 2: 16.0, 3: 32.0, 4: 40.0, 5: 50.0}
  # Per-template tweaks: `line_widths_m` per line (back to front), or `slots_m` as an explicit
  # list of [depth_from_back_m, lateral_m] per slot (replaces generation completely).
  # Formations that are one system seen in different phases (a 3-5-2's wing-backs drop into a
  # back five without the ball). Switching inside a family is not a shape change. Eval showed
  # 62 of 89 false positives were 3-5-2 <-> 5-3-2 flip-flops with possession (FAILURE_LOG).
  equivalent: [["3-5-2", "5-3-2"]]
  # Change-detection-only families (labels, confidences, segments keep the exact formation).
  # [["4-3-3", "4-2-3-1"]] was measured on 15 Oct and is OFF: on seeds 110-119 it cut false
  # positives 34 -> 16 but lost 6 of 38 real changes (hits 34 -> 28, all real 4-3-3 <-> 4-2-3-1
  # switches); dev seeds 27 -> 18 FPs, 39 -> 36 hits. The Phase 3 agent can reject a false
  # candidate but never recover a missed one (FAILURE_LOG 2026-10-15).
  change_equivalent: []
  overrides:
    "4-3-3": {line_widths_m: [40.0, 26.0, 44.0]}
    "4-2-3-1": {line_widths_m: [40.0, 16.0, 40.0, 0.0]}
    "3-4-3": {line_widths_m: [32.0, 42.0, 44.0]}

tactics:
  sample_fps: 1.0                 # frames per second used by the engine (<= MatchState fps)
  window_s: 30.0                  # trailing window for formation classification (causal)
  step_s: 5.0                     # window stride
  min_players: 8                  # outfield players of one team needed to use a frame; with 3+
                                  # missing a whole line can be out of view (dev seeds: FPs 13 -> 5)
  min_usable_fraction: 0.3        # usable frames in a window, else the window is "uncertain"
  coverage_full: 0.8              # visibility at/above which confidence is not penalised
  fit_iterations: 4               # assignment <-> transform refinement rounds per template
  scale_range: [0.6, 1.6]         # allowed anisotropic stretch of a template (depth, width)
  softmax_temperature_m2: 1.5     # template-cost softmax temperature (mean squared residual)
  confidence_threshold: 0.45      # below this the label is "uncertain", never guessed
  goalkeeper:                     # used only when no player carries role "goalkeeper"
    max_depth_m: 20.0             # deepest player within this of own goal line ...
    min_gap_m: 8.0                # ... and this far behind the next deepest is the keeper
  line_drop:                      # defensive line (30 s trailing mean, deepest 4) sits this much
    enabled: false                # OFF (15 Oct): 1.70 false alarms per match on seeds 110-119,
                                  # none on the real clips, recall unmeasurable (FAILURE_LOG)
    min_drop_m: 12.0              # deeper than its reference level ...
    min_hold_s: 180.0             # ... for this long (causal). Dev seeds (tune_line_drop.py): NO
                                  # setting met 1 false alarm per match (synthetic lines follow
                                  # the ball, median 10.5 m per minute); this is the grid's fewest,
                                  # 1.55 per match. Synthetic GT cannot label drops (contract v1.0)
  change:
    min_persist_s: 20.0           # a new formation must hold this long to become a candidate
    max_uncertain_gap_s: 30.0     # uncertain stretch longer than this resets the challenger
  metrics:
    back_line_default: 4          # back-line size when the formation is unknown
    robust_percentiles: [5, 95]   # for compactness (depth) and width
    press_players: 3              # nearest players to the ball for the pressing proxy
    press_near_m: 5.0             # mean distance giving pressing index 1
    press_far_m: 25.0             # mean distance giving pressing index 0
  timeline:
    max_segment_s: 1350.0         # split at least every 22.5 min (keeps the timeline < 8 KB)
    snap_to_period_s: 30.0        # a change this close after a period start happened at the break
    low_visibility_players: 14    # warn when fewer players are visible on average ...
    low_visibility_min_s: 60.0    # ... for at least this long

# --------------------------------------------------------------------------- Phase 1: synthetic
synthetic:
  fps: 2.0                        # pipeline samples real video at 2-5 fps (DATA_NOTES)
  duration_s: 5400.0
  half_time_s: 2700.0
  teams:
    home: {name: Blue, colour: "#1e5fbf", attacking_direction_first_half: right}
    away: {name: Red, colour: "#c0392b", attacking_direction_first_half: left}
  match_001:                      # scripted schedule for data/synthetic/match_001.json
    start: {home: "4-3-3", away: "4-4-2"}
    changes:
      - {team: away, t: 1500.0, to: "4-2-3-1"}
      - {team: away, t: 2700.0, to: "3-5-2"}
      - {team: home, t: 3690.0, to: "4-4-2"}
      - {team: away, t: 4500.0, to: "3-4-3"}
      - {team: home, t: 5100.0, to: "5-3-2"}
  random_schedule:                # used for extra eval matches (other seeds)
    changes_per_team: [1, 3]
    earliest_s: 600.0
    latest_s: 5100.0
    min_gap_s: 600.0
  movement:
    personal_offset_sd_m: 2.0     # fixed per-player habit, so shapes are not textbook copies
    personal_offset_max_m: 4.0
    wobble_sd_m: 2.0              # slow random wander around the slot (Ornstein-Uhlenbeck)
    wobble_tau_s: 8.0
    response_tau_s: 1.5           # how fast a player closes on his target
    max_speed_mps: 8.0
    back_line_base_m: 8.0         # back line depth from own goal = base + gain * ball depth
    back_line_ball_gain: 0.45
    back_line_possession_bonus_m: 4.0
    back_line_range_m: [8.0, 50.0]
    lateral_ball_gain: 0.35
    in_possession_scale: {depth: 1.15, width: 1.10}
    out_of_possession_scale: {depth: 0.85, width: 0.85}
    fullback_push_m: 8.0          # wide players of a back four push up in possession
    winger_drop_m: 5.0            # wide forwards drop out of possession
    wingback_drop_m: 5.0          # wide midfielders of a five drop out of possession
    pressers: 2                   # nearest defenders pulled towards the ball
    press_pull: [0.6, 0.3]
    goalkeeper_depth_m: 4.0
  ball:
    possession_mean_s: 14.0
    waypoint_every_s: [2.0, 6.0]
    max_speed_mps: 18.0
  noise_events:
    set_pieces: [6, 10]           # corners: players crowd the box for 20-30 s
    set_piece_s: [20.0, 30.0]
    counters: [4, 8]              # counter-attacks: front players sprint for 8-12 s
    counter_s: [8.0, 12.0]
    flickers: [2, 3]              # a team briefly adopts another shape for 3 s
    flicker_s: 3.0
  camera:
    broadcast_fraction: 0.3       # share of the match seen through a ball-following window
    broadcast_stretch_s: [120.0, 400.0]
    half_span_m: [16.0, 24.0]     # half the visible pitch length -> roughly 8-16 players
    pan_tau_s: 1.5
  observation:
    miss_prob: 0.05               # detector misses per player per frame
    position_noise_m: 0.7         # homography-style error
    unknown_prob: 0.02            # team classifier not settled yet
    id_switch_per_min: 0.02       # tracker identity switches per player per minute
    include_referee: true
    label_goalkeepers: true

eval:
  synthetic:
    extra_matches: 10             # random-schedule matches on top of match_001 ...
    first_seed: 43                # ... with seeds 43, 44, ...
    dev_seeds: [1000, 1001, 1002] # tuning only; never reported as results
    heldout_seeds: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109]  # official 10-14 Oct; seen
                                  # (the 4-3-3 = 4-2-3-1 problem was found on them)
    heldout_seeds_2: [110, 111, 112, 113, 114, 115, 116, 117, 118, 119]  # official since 15 Oct;
                                  # first run 15 Oct, never tune on these
    tolerance_s: 90.0             # a detected change within this of a true one is a hit
    workers: 4

# --------------------------------------------------------------------------- Phase 3: agent
agent:
  # docs/AGENT_DESIGN.md. Deterministic checks (agent/verify.py): the rules are the judge, the
  # LLM orchestrates and writes. Thresholds set on the dev seeds 42-52 only (build step 1),
  # then frozen; seeds 100-109 = validation, 110-119 = final eval (run once).
  # FROZEN 15 Oct after build step 1 (scripts/eval_agent.py --set dev --grid): rules arm on dev
  # 39/43 alerted, 4 false alerts (one-shot 39 / 27); 63 of 81 grid settings pass the step-1 gate;
  # chosen by max(alerted hits - false alerts) -> persist_pass 0.7 -> 0.6, min_confident 4 -> 3
  # (design values gave 37 / 4). Never re-tune on seeds 100-119.
  # FROZEN AGAIN 17 Oct after Task A (4-3-3/4-2-3-1 metric check, CV on 42-52 + 100-109: did not
  # clearly help, left OFF, not implemented) and the return-leg experiment (OFF, below): no
  # threshold or rule change after this point. eval_agent.py fingerprint of the agent/tactics/
  # bedrock/synthetic/formations config: ca4ff9bbf7b01c6c (the llm arm refuses to resume if
  # it changes).
  verify:
    lookahead_s: 60.0             # verification waits this much play after detection (user, 15 Oct)
    before_s: 45.0                # coverage "before" window: [onset - before_s, onset]
    min_coverage: 0.6             # share of team frames with >= tactics.min_players outfield;
                                  # below it -> a second look first, never a verdict on its own
    persist_pass: 0.6             # new family share of confident look-ahead windows -> held
    persist_fail: 0.4             # at or below -> not held (reject)
    min_confident_windows: 3      # fewer confident look-ahead windows -> persistence unknown
    min_footage_frac: 0.6         # share of the look-ahead that must exist (clip ends)
    return_leg_needs_failed_persistence: false  # R rejects a return leg only if P fails:
                                  # measured 17 Oct, OFF (42-52 + 100-109: +25 false alerts, 0 hits)
    geometry:                     # check_frame_quality (video backend) -> refuse when broken
      min_homography_ok_share: 0.9
      max_shift_px_per_s: 25.0
      max_zoom_change: 0.03
  views:                          # camera trust per view (Phase 2 numbers, DATA_NOTES)
    top: {camera_trust: reliable, max_decision: confirmed, reanalysis_fps: [4, 6]}
    side: {camera_trust: experimental, max_decision: uncertain, reanalysis_fps: [4]}  # user 15 Oct
  reanalysis:
    context_s: 30.0               # extra seconds before [onset - before_s] so the window engine
                                  # has a baseline (one window_s)
    synthetic_sample_fps: 2.0     # synthetic/annotation backend: engine at the MatchState rate
  vision:
    quality_frames: 6             # frames sampled by check_frame_quality (video backend)
    pair_dt_s: 0.5                # each sample is a frame pair this far apart (camera motion rate;
                                  # 0.2 s: 1 px of noise at 960 px width = 20 px/s, too coarse)
    analysis_width_px: 960        # motion / cut checks run on frames downscaled to this width
    orb_features: 1500            # ORB keypoints per frame (cv2.ORB_create)
    min_inliers: 25               # RANSAC inliers needed to call two frames aligned
    cut_min_hist_corr: 0.5        # HSV histogram correlation between samples below this -> cut
    static_max_shift_px: 10.0     # static views: shift vs the calibration frame still "same camera"
    max_window_s: 600.0           # longest window any tool accepts
    max_reanalysis_s: 360.0       # estimated OpenCV time per re-analysis (video backend)
    max_opencv_s_per_match: 1200.0  # re-analysis OpenCV time per match (cache hits are free)
    s_per_frame: {top: 0.33, side: 2.8}  # budget estimate per tracked frame (Phase 2 timings:
                                  # top 4 fps 1.2-1.4 s/s incl. debug video, side 2.7 s/frame)
    grid_s: 5.0                   # re-analysis windows snap outwards to this grid (cache reuse)
    cache_dir: outputs/agent_cache/video
    evidence_width_px: 1280       # evidence frame width
    evidence_format: jpg          # jpg (16 Oct, user-approved): a 400 KB PNG shrank a 4K frame
                                  # to ~570 px wide; png still works
    evidence_jpeg_quality: 90
    evidence_max_bytes: 1000000   # evidence image size cap (downscaled until it fits)
  limits:                         # docs/AGENT_DESIGN.md §6
    max_llm_calls_per_candidate: 8
    max_vision_calls_per_candidate: 3
    max_reanalyses_per_candidate: 2
    max_invalid_in_a_row: 2       # malformed / unknown tool calls in a row -> rules fallback
    max_identical_calls: 2        # the 3rd identical call ends the candidate
    max_nudges: 1                 # text instead of a tool call -> one nudge, then fallback
    max_llm_calls_per_match: 150
    max_tokens_per_match: 400000
    max_cost_usd_per_match: 0.50
    max_candidates_llm: 30        # more candidates in a match -> the rest go to the rules
  llm:
    max_rpm: 18                   # client-side token bucket; account quota is 20 requests/min
    temperature: 0.0
    max_tokens: 400
    tool_choice: any              # every turn is a tool call (checked on Nova in step 4)
    # USD per 1000 tokens [input, output]. Third-party price lists (15 Oct), not the AWS page:
    # confirm before relying on cost numbers.
    prices_per_1k:
      global.amazon.nova-2-lite-v1:0: [0.0003, 0.0025]
      apac.amazon.nova-micro-v1:0: [0.000035, 0.00014]
  outputs:
    trace: outputs/agent_trace.jsonl
    alerts: outputs/alerts.jsonl
    evidence_dir: outputs/evidence
    timeline_suffix: _timeline_verified.json

# --------------------------------------------------------------------------- Phase 3: presentation
# Coach-facing text and pictures only: no decision rule reads this block. It sits outside `agent`
# on purpose, so the frozen decision fingerprint (agent/tactics/bedrock/synthetic/formations,
# ca4ff9bbf7b01c6c) does not change for presentation work (build step 7, 17 Oct).
presentation:
  explain:                        # agent/explain.py: Nova words the code's decision, then a check
    use_llm: true                 # false: the code template for every decision (no LLM call)
    max_sentences: 2
    max_chars: 300
    max_tokens: 200               # output tokens per explanation call
    temperature: 0.0
    time_slack_s: 5.0             # an mm:ss clock in the text must be this close to one in the facts
    max_cost_usd_per_run: 0.50    # explanation calls only (orchestration keeps its own caps)
  evidence:                       # render_evidence shape panels (Toolbox.shape_panels)
    before_search_s: 120.0        # "before" panel: old-shape windows ending in [onset - this, onset]
                                  # (was agent.verify.before_s = 45 s: only set-piece windows there
                                  # on the 16:30 demo alert)
    max_own_box_share: 0.25       # a window with more of the team's outfield positions inside its
                                  # own penalty area shows deep defending or a set piece, not the
                                  # usual shape: skipped, or captioned as such if nothing else fits
                                  # (demo 16:30: 15:15-15:45 had 45 %, open play 16:45-20:55 0-9 %)
  report:                         # agent/report.py: coach report, one call per match
    max_tokens: 1500
    temperature: 0.0
    retries: 1                    # a failed citation check gets one retry, then the template
    max_cost_usd: 0.10

# --------------------------------------------------------------------------- Phase 4: backend
# FastAPI backend (src/gaffer/api, docs/API.md). Outside `agent:` on purpose: nothing here can
# change a decision, so the frozen fingerprint ca4ff9bbf7b01c6c stays. Limits are changeable
# without code (restart the server).
api:
  storage: {backend: local, root: outputs/api}   # s3: {backend: s3, bucket: ..., prefix: ...}
  event_store: {path: outputs/api/events.sqlite3}  # SQLite DB; keep on durable local/EBS storage
  teamtrack_replay:                           # fixed recorded-demo source; never a request path
    manifest: data/clips/teamtrack_top_full.clips.json
    video_root: data/teamtrack/soccer_top/videos
    match_id: teamtrack_top_w900_1260
    start_s: 900
    end_s: 1260
    clip_duration_s: 30
    # real OpenCV + Bedrock demo record(s), imported once into an empty DB at startup
    # (scripts/export_demo_seed.py writes it; only records of seed_analysis_id are allowed)
    seed_file: samples/w900_1260/demo_events_seed.json
    seed_analysis_id: teamtrack_demo_w900_1260
  cors_origins: ["http://localhost:5173", "http://127.0.0.1:5173"]
  web_dist: web/dist              # served at / when it exists (npm run build in web/)
  demo:
    id: w900_1260
    dir: samples/w900_1260
    label: "TeamTrack drone · White vs Blue · 15:00–21:00"
    explanation_set: w900         # samples explanations.json covers several runs
    files:                        # the exact files the frontend reads today (src/data/matches.ts)
      match_state: match_state_top_w900_1260_4fps.json
      team_model: match_state_top_w900_1260_4fps.teams.json
      alerts: alerts_llm.jsonl
      trace: trace_llm.jsonl
      explanations: explanations.json
      report: report_w900_1260.json
      report_markdown: report_w900_1260.md
      run_rows: report_llm.json
      evidence: [evt_003.jpg]
    view: top
  visitors:                       # anonymous visitor id (random, cookie; no personal data)
    cookie: gaffer_visitor
    max_age_days: 365
    max_visitors: 10000           # demo approve / reject kept in memory per visitor (oldest
                                  # forgotten first; a restart forgets all); never global
  uploads:
    max_bytes: 524288000          # 500 MB (a 6 min 4K drone clip is ~130 MB)
    max_duration_s: 370           # 6 min (+10 s: 12 TeamTrack clips of 30.03 s = 360.4 s):
                                  # ~7 min of OpenCV on the laptop CPU + agent checks
    min_duration_s: 5
    extensions: [.mp4, .mov]
    max_aspect: 2.5               # wider frames are panoramas / side cameras: refused
    min_width_px: 640
    chunk_bytes: 1048576
    min_free_disk_gb: 5.0         # below this (plus 2x the upload: Starlette spools the body to
                                  # disk once, we save it once more) an upload is refused: "server full"
    min_free_disk_gb_sample: 0.5  # a sample clip is ~30 MB, so it needs far less room
    retention_hours: 24           # the raw uploaded video is deleted this long after its analysis
                                  # finished (results, events, evidence and the first frame stay);
                                  # a pitch step left open that long is closed and its video deleted
    sweep_interval_s: 900         # how often the clean-up looks (and once at start)
    teamtrack:                  # known clips keep the saved 31-point calibration
      top_pattern: '^D_\d{8}_\d+_(\d+)_(\d+)\.mp4$'   # drone; groups = match start / end s
      side_pattern: '^F_\d{8}_\d+_\d+_\d+\.mp4$'      # fixed side camera: refused (top-down only)
      top_size: [3840, 2160]
  sample_clip:                    # "Try it with a sample clip" (scripts/make_sample_clip.py);
    path: data/sample_clips/teamtrack_top_sample_1080p.mp4   # hidden in the UI if missing
    label: "TeamTrack drone clip · 30 s · 1080p"
    id: teamtrack
    title: "The demo match (TeamTrack)"
    note: "The demo match, where shape changes can be found."
    credit: "Scott et al., TeamTrack, 2024 (MIT licence)"
    credit_url: "https://arxiv.org/abs/2404.13868"
    file_name: gaffer_sample_teamtrack_1080p.mp4
  more_sample_clips:              # further samples, same mechanism (hidden each if its file is missing)
    - id: zenodo
      path: data/sample_clips/zenodo_top_view_1080p.mp4   # 1080p copy of data/zenodo/top-view-preview.mp4
      label: "New ground (Zenodo) · 30 s · 1080p"
      title: "New ground (Zenodo)"
      note: "An unseen ground: shows players and teams on a pitch Gaffer was never tuned on. 30 s is too short for a shape change."
      credit: "Synowiec, Nowak, Kamola, \"Soccer pitch top-view\", DOI 10.5281/zenodo.14867795 (CC BY 4.0)"
      credit_url: "https://doi.org/10.5281/zenodo.14867795"
      file_name: gaffer_sample_zenodo_1080p.mp4
  resolution:                     # low-resolution note on a finished upload (px per metre of pitch,
    low_px_per_m: 12.0            # from the pitch corners). Below -> one line, never a block.
                                  # 12.0 = midway between the 720p copy of the demo (9.3 px/m) and
                                  # a 1080p frame (~14.7 px/m, half of 4K's 29.4): 720p is flagged,
                                  # a full-pitch 1080p clip is not (DATA_NOTES s13).
  runtime:                        # GET /api/runtime (the landing page's "Live on AWS" card)
    imds_timeout_s: 0.4           # per EC2 metadata request; the whole probe stays under imds_total_s
    imds_total_s: 0.9             # off AWS the answer "not running on AWS" comes within this
    imds_cache_s: 3600            # a positive answer (instance type, zone) is kept this long
    imds_miss_cache_s: 30         # a negative one only this long (metadata may not be ready at boot)
    model_labels:                 # display names; unknown ids are shown as they are
      "global.amazon.nova-2-lite-v1:0": "Nova 2 Lite"
      "apac.amazon.nova-micro-v1:0": "Nova Micro"
  jobs:
    view: top                     # uploads are analysed as a top-down view (only one supported)
    arm: auto                     # auto: Nova arm when Bedrock is configured, else rules; llm; rules
    max_cost_usd_per_analysis: 0.30   # orchestration calls (explanations + report have their own caps)
    prior_s_per_video_s: 1.2      # ETA before the first frames are timed (laptop, drone, 4 fps)
    prior_s_per_candidate: 200    # ETA of one agent check before any frame is timed (4K drone)
    eta_frames_per_candidate: 755 # one agent check ~ this many tracked frames of OpenCV (camera
                                  # check ~30 + 145 s re-analysis at ~5 fps), at the upload's own
                                  # measured s/frame: 4K drone ~0.3 s -> ~226 s (Phase 3: 104-252 s
                                  # + 8-13 s check); 960 px generated clip 0.02 s -> ~16 s (15 s)
    prior_candidates_per_min: 1.3 # candidates per minute of drone video before the engine has run
                                  # (Phase 2: 4 in 240 s eval, 6 in 270 s eval2)
    max_queued: 3                 # more waiting uploads -> refused ("try again later")
    debug_video: false
  chat:
    max_question_chars: 500
    history_turns: 6              # last turns sent back to the model
    max_tool_rounds: 4            # data-tool rounds per question
    max_tokens_per_request: 12000 # input + output tokens of one question, all rounds
    max_answer_tokens: 400
    temperature: 0.0
    retries: 1                    # a failed grounding check gets one retry, then a safe answer
    max_questions_per_visitor_per_day: 20   # visitor = X-Visitor-Id header, else client IP (hashed)
  bedrock_daily:                  # global caps per UTC day for every Bedrock call the API makes
    max_calls: 300                # (chat + analyses); refusals are polite, the rules arm still runs
    max_cost_usd: 1.00
    usage_file: outputs/api/usage.json
  posture:                        # advisory analysis after verified event persistence; outside frozen agent rules
    trace_path: outputs/api/posture_trace.jsonl
    max_rpm: 6
    max_evidence_chars: 8000
    max_input_tokens: 12000       # reserved upper bound; if pricing is unknown, Bedrock is not called
    max_output_tokens: 500
    max_calls_per_event: 4        # two assessment rounds plus at most one explicit operator retry
    max_calls_per_match: 24
    max_cost_usd_per_event: 0.02
    max_cost_usd_per_match: 0.10
    stale_pending_after_s: 900    # explicit --retry only; won't steal an active worker call
    # AWS published Nova 2 Lite standard token rates; keep model rates explicit and reviewed.
    # https://aws.amazon.com/bedrock/pricing/ (input/output USD per million tokens)
    prices_per_million:
      "global.amazon.nova-2-lite-v1:0": {input: 0.30, output: 2.50}
    directional_delta_min_m: 2.0
    width_delta_min_m: 3.0
    min_segment_confidence: 0.45
    max_uncertain_fraction: 0.50
    min_coverage: 0.50
    min_mean_players_visible: 6.0
    max_reanalysis_window_s: 45.0
    reanalysis_fps: [5]
