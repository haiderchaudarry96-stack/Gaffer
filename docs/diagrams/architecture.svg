<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
<title id="t">Gaffer architecture</title><desc id="d">The coach’s browser talks HTTPS to Caddy on one EC2 instance in Sydney. The Gaffer container runs OpenCV 5 perception, the tactics engine and the agent; the agent reads numbers and short text from Amazon Bedrock. S3 holds clips and the model, CloudWatch gets logs and metrics, and an IAM instance role replaces access keys.</desc>
<rect id="background" width="1920" height="1080" fill="#070D0A"/>
<g id="header"><g id="logo" transform="translate(56 28) scale(0.875)"><rect width="64" height="64" rx="14" fill="#070D0A"/><rect x="9" y="12" width="46" height="40" rx="4" fill="#16231C" stroke="#8FA398" stroke-width="3"/><line x1="32" y1="12" x2="32" y2="52" stroke="#8FA398" stroke-width="2.2"/><circle cx="19" cy="23" r="4.2" fill="#FF5B4F"/><circle cx="19" cy="41" r="4.2" fill="#FF5B4F"/><circle cx="45" cy="23" r="4.2" fill="#44C8FF"/><path d="M30 41 L38 49 L56 30" fill="none" stroke="#070D0A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 41 L38 49 L56 30" fill="none" stroke="#C8F542" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="128" y="68" font-family="Space Grotesk, Inter, sans-serif" font-size="40" font-weight="700" fill="#EEF4F0" letter-spacing="-0.5">Gaffer<tspan fill="#8FA398" font-weight="500" dx="14">Architecture</tspan></text><text x="128" y="102" font-family="Inter, sans-serif" font-size="21" font-weight="400" fill="#8FA398" data-maxw="1320">OpenCV 5 does the seeing on EC2. Bedrock Nova 2 Lite only reads numbers and short text, never pixels.</text><text x="1864" y="68" font-family="JetBrains Mono, monospace" font-size="18" font-weight="400" fill="#8FA398" text-anchor="end">gaffer-tactics.duckdns.org</text></g>
<g id="aws-cloud"><rect x="340" y="150" width="1524" height="816" rx="24" fill="#0A120E" stroke="#2F4538" stroke-width="2" stroke-dasharray="10 8"/><g transform="translate(366 168) scale(1.25)" fill="none" stroke="#8FA398" stroke-width="1.52" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-7.97A6 6 0 0 1 18 9.5 4.5 4.5 0 0 1 17.5 18z"/></g><text x="406" y="191" font-family="Space Grotesk, Inter, sans-serif" font-size="24" font-weight="700" fill="#EEF4F0" data-maxw="200">AWS Cloud</text><text x="540" y="191" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#8FA398" data-maxw="300">ap-southeast-2 (Sydney)</text></g>
<g id="coach-browser"><rect x="56" y="308" width="240" height="260" rx="14" fill="#0F1914" stroke="#2F4538" stroke-width="1.5"/><g transform="translate(76 326) scale(1.25)" fill="none" stroke="#C8F542" stroke-width="1.52" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9.5h18"/><circle cx="6.5" cy="6.8" r="0.6"/></g><text x="76" y="392" font-family="Space Grotesk, Inter, sans-serif" font-size="24" font-weight="700" fill="#EEF4F0" data-maxw="208">Coach’s browser</text><text x="76" y="428" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#8FA398" data-maxw="208">upload or sample clip</text><text x="76" y="458" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#8FA398" data-maxw="208">2D pitch + timeline</text><text x="76" y="488" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#8FA398" data-maxw="208">evidence + chat</text><text x="76" y="518" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#8FA398" data-maxw="208">approve / reject</text><text x="76" y="548" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#C8F542" data-maxw="208">Live on AWS card</text></g>
<g id="ec2"><rect x="372" y="214" width="1132" height="436" rx="20" fill="#0F1914" stroke="#2F4538" stroke-width="2"/><g transform="translate(396 232) scale(1.3333333333333333)" fill="none" stroke="#C8F542" stroke-width="1.42" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/></g><text x="440" y="258" font-family="Space Grotesk, Inter, sans-serif" font-size="26" font-weight="700" fill="#EEF4F0" data-maxw="200">Amazon EC2</text><text x="600" y="258" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#8FA398" data-maxw="300">m7i-flex.large · Docker</text><text x="1480" y="258" font-family="JetBrains Mono, monospace" font-size="18" font-weight="400" fill="#8FA398" text-anchor="end" data-maxw="560">Elastic IP · ports 80 + 443 only · no SSH</text></g>
<g id="caddy"><rect x="400" y="328" width="184" height="220" rx="14" fill="#16231C" stroke="#2F4538" stroke-width="1.5"/><g transform="translate(420 346) scale(1.25)" fill="none" stroke="#C8F542" stroke-width="1.52" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g><text x="420" y="412" font-family="Space Grotesk, Inter, sans-serif" font-size="26" font-weight="700" fill="#EEF4F0" data-maxw="152">Caddy</text><text x="420" y="448" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#8FA398" data-maxw="152">HTTPS (TLS)</text><text x="420" y="478" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#8FA398" data-maxw="152">auto certificate</text><text x="420" y="508" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#8FA398" data-maxw="152">in front of</text><text x="420" y="538" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#8FA398" data-maxw="152">the app</text></g>
<g id="gaffer-container"><rect x="640" y="276" width="836" height="348" rx="18" fill="#0F1914" stroke="#C8F542" stroke-width="2" stroke-dasharray="8 6"/><text x="662" y="306" font-family="Space Grotesk, Inter, sans-serif" font-size="20" font-weight="700" fill="#EEF4F0" data-maxw="220">Gaffer container</text><text x="842" y="306" font-family="Inter, sans-serif" font-size="18" font-weight="400" fill="#8FA398" data-maxw="420">one worker, one analysis at a time</text></g>
<g id="perception"><rect x="662" y="328" width="280" height="220" rx="14" fill="#16231C" stroke="#C8F542" stroke-width="2"/><g transform="translate(682 346) scale(1.25)" fill="none" stroke="#C8F542" stroke-width="1.52" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></g><text x="682" y="412" font-family="Space Grotesk, Inter, sans-serif" font-size="24" font-weight="700" fill="#EEF4F0" data-maxw="246">OpenCV 5 perception</text><circle cx="688" cy="442" r="4" fill="#C8F542"/><text x="702" y="449" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#EEF4F0" data-maxw="234">Self-calibration</text><circle cx="688" cy="470" r="4" fill="#C8F542"/><text x="702" y="477" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#EEF4F0" data-maxw="234">Pitch + homography</text><circle cx="688" cy="498" r="4" fill="#C8F542"/><text x="702" y="505" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#EEF4F0" data-maxw="234">Detection</text><circle cx="688" cy="526" r="4" fill="#C8F542"/><text x="702" y="533" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#EEF4F0" data-maxw="234">Tracking + team colours</text></g>
<g id="tactics"><rect x="998" y="328" width="176" height="220" rx="14" fill="#0F1914" stroke="#2F4538" stroke-width="1.5"/><g transform="translate(1018 346) scale(1.25)" fill="none" stroke="#C8F542" stroke-width="1.52" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14"/><circle cx="12" cy="12" r="2.6"/></g><text x="1018" y="412" font-family="Space Grotesk, Inter, sans-serif" font-size="26" font-weight="700" fill="#EEF4F0" data-maxw="144">Tactics</text><text x="1018" y="448" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#8FA398" data-maxw="144">formation over</text><text x="1018" y="478" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#8FA398" data-maxw="144">30 s window,</text><text x="1018" y="508" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#8FA398" data-maxw="144">every 5 s;</text><text x="1018" y="538" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#8FA398" data-maxw="144">shape changes</text></g>
<g id="agent"><rect x="1230" y="328" width="224" height="220" rx="14" fill="#0F1914" stroke="#C8F542" stroke-width="1.5"/><g transform="translate(1250 346) scale(1.25)" fill="none" stroke="#C8F542" stroke-width="1.52" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H15a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h6.5"/></g><text x="1250" y="412" font-family="Space Grotesk, Inter, sans-serif" font-size="26" font-weight="700" fill="#EEF4F0" data-maxw="192">Agent</text><text x="1250" y="448" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#8FA398" data-maxw="192">rules decide</text><text x="1250" y="478" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#8FA398" data-maxw="192">Nova orchestrates</text><text x="1250" y="508" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#8FA398" data-maxw="192">OpenCV re-checks</text></g>
<g id="api-strip"><rect x="662" y="566" width="792" height="40" rx="10" fill="#16231C"/><text x="678" y="593" font-family="JetBrains Mono, monospace" font-size="18" font-weight="400" fill="#8FA398" data-maxw="760">FastAPI · serves the web app · /api/runtime → “Live on AWS” card</text></g>
<g id="bedrock"><rect x="1548" y="308" width="296" height="260" rx="14" fill="#0F1914" stroke="#2F4538" stroke-width="1.5"/><g transform="translate(1568 326) scale(1.25)" fill="none" stroke="#C8F542" stroke-width="1.52" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3l1.9 5.1L18 10l-5.1 1.9L11 17l-1.9-5.1L4 10l5.1-1.9z"/><path d="M19 15v4M17 17h4"/></g><text x="1568" y="392" font-family="Space Grotesk, Inter, sans-serif" font-size="26" font-weight="700" fill="#EEF4F0" data-maxw="264">Amazon Bedrock</text><text x="1568" y="428" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#8FA398" data-maxw="264">Nova 2 Lite</text><text x="1568" y="458" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#8FA398" data-maxw="264">numbers + short text</text><text x="1568" y="488" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#C8F542" data-maxw="264">never pixels</text></g>
<g id="s3"><rect x="372" y="700" width="464" height="110" rx="14" fill="#0F1914" stroke="#2F4538" stroke-width="1.5"/><g transform="translate(394 722) scale(1.4166666666666667)" fill="none" stroke="#C8F542" stroke-width="1.34" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6l2 13c.2 1 2.8 2 6 2s5.8-1 6-2l2-13"/></g><text x="450" y="742" font-family="Space Grotesk, Inter, sans-serif" font-size="26" font-weight="700" fill="#EEF4F0" data-maxw="366">Amazon S3</text><text x="450" y="774" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#8FA398" data-maxw="366">clips, samples, model</text><text x="450" y="802" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#8FA398" data-maxw="366">fetched at container start</text></g>
<g id="cloudwatch"><rect x="876" y="700" width="464" height="110" rx="14" fill="#0F1914" stroke="#2F4538" stroke-width="1.5"/><g transform="translate(898 722) scale(1.4166666666666667)" fill="none" stroke="#C8F542" stroke-width="1.34" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16"/><path d="M7.5 15l3.5-5 3 3 5-6"/></g><text x="954" y="742" font-family="Space Grotesk, Inter, sans-serif" font-size="26" font-weight="700" fill="#EEF4F0" data-maxw="366">Amazon CloudWatch</text><text x="954" y="774" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#8FA398" data-maxw="366">logs + metrics</text><text x="954" y="802" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#8FA398" data-maxw="366">log group /gaffer/app</text></g>
<g id="ebs"><rect x="1380" y="700" width="464" height="110" rx="14" fill="#0F1914" stroke="#2F4538" stroke-width="1.5"/><g transform="translate(1402 722) scale(1.4166666666666667)" fill="none" stroke="#C8F542" stroke-width="1.34" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></g><text x="1458" y="742" font-family="Space Grotesk, Inter, sans-serif" font-size="26" font-weight="700" fill="#EEF4F0" data-maxw="366">EBS volume · 30 GB</text><text x="1458" y="774" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#8FA398" data-maxw="366">uploads, results, event DB</text><text x="1458" y="802" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#8FA398" data-maxw="366">raw video deleted after 24 h</text></g>
<g id="iam"><rect x="372" y="850" width="1472" height="78" rx="16" fill="#16231C" stroke="#2F4538" stroke-width="1.5"/><g transform="translate(396 872) scale(1.4166666666666667)" fill="none" stroke="#C8F542" stroke-width="1.34" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14 9l2 2"/></g><text x="446" y="897" font-family="Space Grotesk, Inter, sans-serif" font-size="26" font-weight="700" fill="#EEF4F0" data-maxw="260">IAM instance role</text><text x="676" y="897" font-family="Inter, sans-serif" font-size="20" font-weight="400" fill="#8FA398" data-maxw="1140">No access keys on disk. Allows Nova 2 Lite, one S3 bucket, one log group.</text></g>
